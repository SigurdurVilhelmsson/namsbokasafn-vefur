version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      development:
        dependency-type: "development"
        patterns:
          - "*"
        # The accessibility ratchet (e2e/a11y-baseline.json) depends on the axe-core
        # version and on Playwright's Chromium: a new axe rule, or a browser that paints
        # differently, changes what fails. Each arrives in a PR of its own, so a baseline
        # change can be traced to it (axe-core 4.14 adds label-content-name-mismatch).
        exclude-patterns:
          - "@axe-core/playwright"
          - "@playwright/test"
      production:
        dependency-type: "production"
        patterns:
          - "*"
    ignore:
      # TypeScript 7 breaks `npm ci` on a fresh clone. Three consumers still cap
      # below it (versions as locked on main, 2026-10-01), and Dependabot does
      # not honour peerOptional conflicts:
      #   @sveltejs/kit@2.70.3  peer typescript ^5.3.3 || ^6.0.0
      #   typescript-eslint@8.68.0  peer typescript >=4.8.4 <6.1.0
      #   svelte-check@4.7.6  peer typescript ^5.0.0 || ^6.0.0
      # The intersection is 6.0.x, which is why package.json pins ~6.0.3 rather
      # than ^6 (^6 would admit 6.1 and re-break typescript-eslint).
      #
      # Dependabot proposed the 7.x bump twice: PR #190 (merged 2026-07-14,
      # which made a fresh clone uninstallable and went unnoticed because CI is
      # billing-blocked) and PR #195 (closed 2026-07-25).
      #
      # REMOVE THIS IGNORE once all three peers admit 7.x — check with:
      #   npm view @sveltejs/kit peerDependencies.typescript
      #   npm view typescript-eslint peerDependencies.typescript
      #   npm view svelte-check peerDependencies.typescript
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # SvelteKit 3, and adapter-static 4 (which peers kit ^3), cannot install
      # here yet. Every @vite-pwa/sveltekit release up to 1.1.0, the latest on
      # 2026-10-24, peers @sveltejs/kit "^1.3.1 || ^2.0.1", so `npm ci` fails
      # with ERESOLVE (PR #281), and the rest of the development group is
      # blocked with it. Don't force it with --legacy-peer-deps: upstream
      # reports that kit 3 with @vite-pwa/sveltekit 1.1.0 builds green but
      # emits no service worker (vite-pwa/sveltekit#111, closed unmerged on
      # 2026-10-09; support is planned, with no date).
      #
      # REMOVE THESE TWO IGNORES once a @vite-pwa/sveltekit release admits
      # kit 3. Check with:
      #   npm view @vite-pwa/sveltekit@latest peerDependencies
      # Then migrate by hand (npx sv migrate sveltekit-3), and in the same PR
      # delete the `cookie` override: it exists for kit 2's cookie ^0.6.0, and
      # kit 3 declares ^2.0.1, which the override would hold at 0.7.2. Until
      # then the full-tree audit keeps kit's two low advisories, which are
      # fixed only in 3.0.0.
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
