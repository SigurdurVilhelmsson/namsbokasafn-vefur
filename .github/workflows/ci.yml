name: CI

on:
  push:
    # feature/** are long-lived integration branches (e.g. reader v1.x);
    # they merge to main wholesale, so they need the same gate
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  # Manual trigger. Needed to re-verify CI health without inventing a commit —
  # e.g. after the 2026-07 Actions billing outage, when every run failed in ~3s
  # and there was no way to confirm the fix short of pushing something.
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SigurdurVilhelmsson/namsbokasafn-efni
          path: namsbokasafn-efni
          # namsbokasafn-efni went public 2026-07-25, so the default workflow
          # token can read it — public repos need no permission grant. The
          # EFNI_TOKEN PAT this used to prefer is gone.
          token: ${{ github.token }}
          # Keep credentials out of the workspace git config, where later
          # PR-controlled steps (npm scripts, tests) could read them
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        run: |
          mkdir -p static/content
          node scripts/sync-content.js --source ./namsbokasafn-efni

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build:no-validate

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SigurdurVilhelmsson/namsbokasafn-efni
          path: namsbokasafn-efni
          # namsbokasafn-efni went public 2026-07-25, so the default workflow
          # token can read it — public repos need no permission grant. The
          # EFNI_TOKEN PAT this used to prefer is gone.
          token: ${{ github.token }}
          # Keep credentials out of the workspace git config, where later
          # PR-controlled steps (npm scripts, tests) could read them
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        run: |
          mkdir -p static/content
          node scripts/sync-content.js --source ./namsbokasafn-efni

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npm run build:no-validate

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gate: anything that reaches a reader of the built site. This is a
      # static site with no server code, so the production tree is what ships.
      # Currently reports 0 vulnerabilities.
      - name: Security audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      # Visibility, non-blocking: the full tree including build tooling.
      #
      # Not a gate, because one advisory here is genuinely unfixable rather than
      # merely unfixed. brace-expansion's OOM advisory (GHSA-mh99-v99m-4gvg) has
      # range `<=5.0.7`, which npm applies across ALL majors, so the 2.x copy under
      # filelist -> minimatch stays flagged even at 2.1.2 — the 2.x line never got
      # that patch. It cannot be overridden to 5.x: minimatch@5.1.9 calls
      # `require('brace-expansion')` as a FUNCTION and 5.x exports an OBJECT, so
      # forcing it throws "expand is not a function" at build time. It cannot be
      # upgraded away either: @vite-pwa/sveltekit, vite-plugin-pwa and workbox-build
      # are all already at their latest releases.
      #
      # Gating on it would mean a permanently red build that everyone learns to
      # ignore — which is exactly how the TypeScript 7 breakage slipped in. Keep it
      # visible and honest, but do not let it mask a real regression in the blocking
      # step above. Revisit making it blocking when the PWA chain moves.
      - name: Security audit (full tree, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
