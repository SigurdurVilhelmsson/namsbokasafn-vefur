name: CI

on:
  push:
    # feature/** are long-lived integration branches (e.g. reader v1.x);
    # they merge to main wholesale, so they need the same gate
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  # Manual trigger. Needed to re-verify CI health without inventing a commit —
  # e.g. after the 2026-07 Actions billing outage, when every run failed in ~3s
  # and there was no way to confirm the fix short of pushing something.
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SigurdurVilhelmsson/namsbokasafn-efni
          path: namsbokasafn-efni
          # namsbokasafn-efni went public 2026-07-25, so the default workflow
          # token can read it — public repos need no permission grant. The
          # EFNI_TOKEN PAT this used to prefer is gone.
          token: ${{ github.token }}
          # Keep credentials out of the workspace git config, where later
          # PR-controlled steps (npm scripts, tests) could read them
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        run: |
          mkdir -p static/content
          node scripts/sync-content.js --source ./namsbokasafn-efni

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build:no-validate

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SigurdurVilhelmsson/namsbokasafn-efni
          path: namsbokasafn-efni
          # namsbokasafn-efni went public 2026-07-25, so the default workflow
          # token can read it — public repos need no permission grant. The
          # EFNI_TOKEN PAT this used to prefer is gone.
          token: ${{ github.token }}
          # Keep credentials out of the workspace git config, where later
          # PR-controlled steps (npm scripts, tests) could read them
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        run: |
          mkdir -p static/content
          node scripts/sync-content.js --source ./namsbokasafn-efni

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npm run build:no-validate

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gate: anything that reaches a reader of the built site. This is a
      # static site with no server code, so the production tree is what ships.
      # Currently reports 0 vulnerabilities.
      - name: Security audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      # Visibility, non-blocking: the full tree including build tooling.
      #
      # Measured 2026-08-22: 0 vulnerabilities at every severity. Do NOT read that
      # as a steady state — a dev-tree advisory can appear any week, and it is
      # usually FIXABLE by re-pinning the `overrides` block in package.json.
      # READ the output before dismissing it.
      #
      # This comment previously claimed brace-expansion's OOM advisory was
      # permanently unfixable, because minimatch@5.1.9 calls
      # `require('brace-expansion')` as a FUNCTION while 5.x exports an OBJECT.
      # The export hazard is real; the conclusion was not. The two selectors
      # `brace-expansion@^2` / `brace-expansion@^5` pin each major independently,
      # and 2.1.4 is published, outside the advisory range, and still a function
      # export (verified at runtime, not from the registry metadata).
      #
      # Still non-blocking, for the original reason: this is a static site with no
      # server code, so the production tree above is what ships. A dev-tree advisory
      # with no fix yet must not block a deploy, and a permanently red step is one
      # everyone learns to ignore — which is exactly how the TypeScript 7 breakage
      # slipped in.
      - name: Security audit (full tree, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
