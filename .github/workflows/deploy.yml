# Production deploy — manual trigger or release tag, never on plain pushes.
#
# Security model: the SSH key in the `production` environment is a dedicated
# deploy key whose authorized_keys entry on the server carries a forced
# rrsync command locked to the build directory — it can write
# /var/www/namsbokasafn-vefur/build and nothing else (no shell, no other
# paths). Setup instructions: docs/guides/deployment.md
#
# Content is published from an EXPLICIT efni commit, never from efni's default
# branch: a manual run takes the `efni_ref` input, a tag run the
# EFNI_PUBLISHED_REF variable, and the run stops if neither is set. efni's main
# can be ahead of what is meant to be live (renamed pages whose redirects have
# not landed), so publishing it by default is not safe.
#
# ⚠️ The pin chooses a content REVISION, not which books: every run re-syncs
# every book on the publication allowlist at that revision and deploys with no
# dry-run stop. While a book is under a hold (CLAUDE.md, Current Development
# Status), do not run this workflow. (Nothing yet records which efni commit
# prod's content came from, so there is no known-safe pin to fall back on.)

name: Deploy

on:
  workflow_dispatch:
    inputs:
      efni_ref:
        description: 'Full 40-character efni commit SHA whose content to publish'
        required: true
        type: string
  push:
    tags: ['v*.*.*']

# Never run two deploys at once; queue instead of cancelling so a release
# tag and a manual run can't interleave half-synced output
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://namsbokasafn.is
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Inputs reach the shell through env, never by interpolating them into
      # the script, so a crafted ref cannot inject commands.
      - name: Resolve the efni commit to publish
        id: efni
        env:
          INPUT_REF: ${{ inputs.efni_ref }}
          PINNED_REF: ${{ vars.EFNI_PUBLISHED_REF }}
        run: |
          REF="${INPUT_REF:-$PINNED_REF}"
          if [ -z "$REF" ]; then
            echo "::error::No efni ref to publish. Pass the efni_ref input, or set the EFNI_PUBLISHED_REF variable for tag runs. This workflow never publishes efni's default branch implicitly."
            exit 1
          fi
          # A full commit SHA only: a branch name would move under the deploy,
          # which is exactly what pinning is meant to prevent. [[ =~ ]] tests the
          # WHOLE string; grep would pass a multi-line value line by line, and a
          # second "ref=" line would then override the output.
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::efni ref must be a full 40-character commit SHA, got: $REF"
            exit 1
          fi
          echo "Publishing efni content from: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SigurdurVilhelmsson/namsbokasafn-efni
          path: namsbokasafn-efni
          ref: ${{ steps.efni.outputs.ref }}
          # namsbokasafn-efni went public 2026-07-25 — the default workflow
          # token can read it; no PAT needed.
          token: ${{ github.token }}
          # Keep credentials out of the workspace git config
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        run: |
          mkdir -p static/content
          node scripts/sync-content.js --source ./namsbokasafn-efni

      # The artifact that ships is verified right here, in this run —
      # not assumed from an earlier CI run on a different commit
      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build (with content validation)
        run: npm run build

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          EFNI_REF: ${{ steps.efni.outputs.ref }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "Deploy credentials are not configured (production environment" \
                 "secret DEPLOY_SSH_KEY; variables DEPLOY_KNOWN_HOSTS," \
                 "DEPLOY_USER, DEPLOY_HOST). See docs/guides/deployment.md"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          # scripts/deploy.js is the same command a manual deploy uses. It
          # derives its rsync rules from the publication allowlist, efni's
          # source tree and KNOWN_BOOKS, never from a list hardcoded here, and
          # prints them:
          #   P /_app/immutable/**  keep earlier builds' hashed CSS/JS, which the
          #                         frozen books' pages still load
          #   - downloads/          PDFs exist only on the server
          #   - <book>/             withheld books: neither sent nor deleted
          #   H <editor artifact>   never sent; copies already on the server
          #                         are deleted
          # It refuses to run if the build lacks a published book's content.
          # ⚠️ Never add --delete-excluded. See scripts/deploy-excludes.js.
          #
          # The forced rrsync command on the server roots the remote path at
          # the build directory, so the destination is "/".
          export RSYNC_RSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes"
          node scripts/deploy.js --source ./namsbokasafn-efni --target "$DEPLOY_USER@$DEPLOY_HOST:/" --apply
          echo "Deployed $(git rev-parse --short HEAD) with efni $EFNI_REF to https://namsbokasafn.is"
