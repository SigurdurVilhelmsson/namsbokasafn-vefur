# Nginx Configuration for Námsbókasafn Reader
# Domain: namsbokasafn.is
#
# Installation instructions:
# 1. Copy this file to /etc/nginx/sites-available/namsbokasafn.is
# 2. Create symlink: sudo ln -s /etc/nginx/sites-available/namsbokasafn.is /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
# 5. Get SSL cert: sudo certbot --nginx -d namsbokasafn.is -d www.namsbokasafn.is
#
# IMPORTANT: nginx header inheritance caveat
# ──────────────────────────────────────────
# Any `add_header` directive in a location block REPLACES all server-level
# add_header directives. To ensure security headers appear on every response,
# they must be repeated in each location block that uses add_header.
#
# CSP 'unsafe-inline' rationale:
# - script-src: SvelteKit adapter-static generates inline <script> tags for
#   module loading in pre-rendered HTML. Dynamic nonces are not possible with
#   static files served directly by nginx.
# - style-src: Svelte compiles style: directives to inline style attributes
#   at runtime, and app.html uses style="display: contents" on the body wrapper.

# HTTP - Redirect all traffic to HTTPS (non-www)
server {
    listen 80;
    listen [::]:80;
    server_name namsbokasafn.is www.namsbokasafn.is;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS (canonical domain)
    location / {
        return 301 https://namsbokasafn.is$request_uri;
    }
}

# HTTPS - Redirect www to non-www (canonical domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.namsbokasafn.is;

    ssl_certificate /etc/letsencrypt/live/namsbokasafn.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namsbokasafn.is/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/namsbokasafn.is/chain.pem;

    return 301 https://namsbokasafn.is$request_uri;
}

# HTTPS - Main Námsbókasafn site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name namsbokasafn.is;

    # Document root - where your built SvelteKit app lives
    root /var/www/namsbokasafn-vefur/build;
    index index.html;

    # SSL Certificate paths (will be configured by certbot)
    ssl_certificate /etc/letsencrypt/live/namsbokasafn.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namsbokasafn.is/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/namsbokasafn.is/chain.pem;

    # SSL Configuration - Modern, secure settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # NOTE: OCSP stapling intentionally omitted. Let's Encrypt stopped embedding
    # OCSP responder URLs in certificates (2024, OCSP retired in favour of CRLs),
    # so `ssl_stapling on` is a no-op that only emits a warning on reload.

    # Security Headers (repeated in location blocks that use add_header — see note above)
    # CSP frame-src: textbook embeds (PhET simulations, YouTube) render as
    # <iframe>s; without an explicit frame-src they would fall back to
    # default-src 'self' and be blocked. Keep the origin list in sync with
    # what the efni pipeline resolves embeds to (tools/lib/embed-resolve.js).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Logging
    access_log /var/log/nginx/namsbokasafn.is.access.log;
    error_log /var/log/nginx/namsbokasafn.is.error.log;

    # ── Book slug redirects (301 permanent) ──────────────────
    # efnafraedi was renamed to efnafraedi-2e to distinguish editions.
    # Must precede the asset-cache regex below: nginx picks the FIRST
    # matching regex location, and /content/efnafraedi/...jpg should
    # redirect, not 404 from the cache block.
    location ~ ^/efnafraedi(/.*)?$ {
        return 301 /efnafraedi-2e$1$is_args$args;
    }
    location ~ ^/content/efnafraedi(/.*)?$ {
        return 301 /content/efnafraedi-2e$1$is_args$args;
    }

    # ── Renamed section slugs (§C9) — FOLLOW-UP, NOT YET APPLIED ─────
    # A Pass-1 review that corrects a section title renames the rendered
    # file, because the title drives the slug. efni prunes the superseded
    # page and records old→new in
    # static/content/<book>/slug-map.<track>.json.
    #
    # The app already serves these as *soft* redirects: the section route
    # prerenders a ~130-byte meta-refresh stub for each old slug, which
    # works under the config below with no nginx change at all. These
    # blocks are the optional SEO upgrade — a real 301 instead of a 200
    # plus a client-side hop. Both slugs are in the sitemap and each
    # self-canonicalises, which is the argument for bothering.
    #
    # ⚠️ DO NOT APPLY UNTIL THE PRUNE HAS DEPLOYED. `return 301` runs
    # before try_files and has no on-disk guard, so while the old page is
    # still published this redirects a live ~314 KB page away. Verify
    # first — /content/efnafraedi-2e/chapters/10/10-5-fast-astand-efnis.html
    # must return 404, not 200. (Pair it with a control you expect to
    # still 404, e.g. a nonsense .html in the same directory; a set of
    # uniformly clean results is indistinguishable from fetching nothing.)
    #
    # ✅ VERIFIED 2026-09-03 against live namsbokasafn.is — the guard above is
    # SATISFIED for the two efnafraedi-2e renames below, and for those only.
    # Measured (HTTP / bytes), with both controls in the same run:
    #     404    162  /content/…/chapters/10/10-5-fast-astand-efnis.html      (old)
    #     200 21,731  /content/…/chapters/10/10-5-fastur-efnishamur.html      (new)
    #     404    162  /content/…/chapters/10/zzz-nonsense-control.html        (control)
    #     404    162  /content/…/chapters/20/20-3-aldehyd-ketonar-….html      (old)
    #     200 55,381  /content/…/chapters/20/20-3-aldehyd-keton-….html        (new)
    # The old slugs return byte-identically to a URL that never existed, which is
    # what makes the 404 mean "this page is gone" rather than "the book is gone".
    #
    # ⚠️ APPLYING IS STILL NOT URGENT, AND THE MEASUREMENT SAYS WHY: the page URLs
    # already redirect. /efnafraedi-2e/kafli/10/10-5-fast-astand-efnis/ serves a
    # 172-byte meta-refresh stub and the ch20 one 212 bytes, against 313,414 and
    # 349,838 bytes for their live targets and 3,012 for the SPA shell. So readers
    # following an old chemistry link land correctly TODAY. Uncommenting buys a real
    # 301 instead of a 200-plus-client-hop — an SEO upgrade, not a fix.
    #
    # ⚠️ THIS VERIFICATION IS POINT-IN-TIME AND COVERS TWO RENAMES. The other seven
    # entries in src/lib/data/sectionRedirects.ts (edlisfraedi-2e ch04 x4,
    # lifraen-efnafraedi ch03 x3) are PRE-SYNC: their old pages are still published,
    # so a `return 301` for any of them would redirect a live page away. They are
    # deliberately absent from this file. Re-run the probe above before adding one.
    #
    # ⚠️ Exact (`=`) matches deliberately — highest nginx priority and zero
    # collateral risk. Add one PAIR per rename (with and without the
    # trailing slash); the app sets trailingSlash: 'always', so the
    # canonical target carries the slash. Keep in step with
    # src/lib/data/sectionRedirects.ts.
    #
    # efnafraedi-2e m68770, recorded 2026-08-18:
    # location = /efnafraedi-2e/kafli/10/10-5-fast-astand-efnis/ {
    #     return 301 /efnafraedi-2e/kafli/10/10-5-fastur-efnishamur/;
    # }
    # location = /efnafraedi-2e/kafli/10/10-5-fast-astand-efnis {
    #     return 301 /efnafraedi-2e/kafli/10/10-5-fastur-efnishamur/;
    # }
    #
    # efnafraedi-2e m68848, renamed by efni's C56 re-render 2026-08-12 and NOT
    # in any slug map (it predates §C9), so nothing warns about it:
    # location = /efnafraedi-2e/kafli/20/20-3-aldehyd-ketonar-karboxylsyrur-og-estrar/ {
    #     return 301 /efnafraedi-2e/kafli/20/20-3-aldehyd-keton-karboxylsyrur-og-estrar/;
    # }
    # location = /efnafraedi-2e/kafli/20/20-3-aldehyd-ketonar-karboxylsyrur-og-estrar {
    #     return 301 /efnafraedi-2e/kafli/20/20-3-aldehyd-keton-karboxylsyrur-og-estrar/;
    # }

    # Hash-versioned SvelteKit bundles: filenames change on every build,
    # so these (and only these) are safely immutable. ^~ prefix match
    # takes priority over the regex locations below.
    location ^~ /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        access_log off;
    }

    # Self-hosted fonts: stable files, long cache without immutable
    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        access_log off;
    }

    # Other static assets (styles/content.css, icons, covers, content
    # images): UNHASHED filenames that change on deploys/content syncs —
    # must revalidate so corrected figures and the cross-repo stylesheet
    # reach returning browsers within a day
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        access_log off;
    }

    # Cache JSON content files
    location ~* /content/.*\.json$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # Cache HTML content files (pre-rendered from CNXML pipeline)
    location ~* /content/.*\.html$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # SPA routing - serve 200.html fallback for unprerendered routes
    location / {
        try_files $uri $uri/ /200.html;
    }

    # Don't cache SPA fallback (always serve fresh)
    location = /200.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        expires 0;
    }

    # Don't cache the prerendered catalog at / (index.html) — it changes on every
    # deploy, so serve fresh. `index index.html` internally rewrites / to
    # /index.html, which matches this block.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        expires 0;
    }

    # GoAccess traffic report - restricted to admin use
    # Generate reports with: sudo scripts/setup-goaccess.sh report
    # Create password file: sudo htpasswd -c /etc/nginx/.htpasswd admin
    location = /traffic-report.html {
        auth_basic "Umferðarskýrsla";
        auth_basic_user_file /etc/nginx/.htpasswd;

        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
        expires 0;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com https://tutor.namsbokasafn.is https://ritstjorn.namsbokasafn.is; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube.com https://phet.colorado.edu; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }
}

