<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pre-paint (reader plan S6.2, register UI-22): apply the stored theme and line width
         before the page draws, so a dark-theme reader sees no light flash and a stored width
         no reflow when the app starts. It repeats the settings store's checks (settings.ts),
         and settings.test.ts runs this script against the store. The 'dark' class also sets
         color-scheme, through app.css. The print pages stay light, as their layout forces. -->
    <script>
      (function () {
        try {
          if (location.pathname.indexOf("/print/") === 0) return;
          var s = JSON.parse(localStorage.getItem("namsbokasafn:settings"));
          if (!s) return;
          var html = document.documentElement;
          if (s.theme === "dark") html.classList.add("dark");
          if (
            s.lineWidth === "narrow" ||
            s.lineWidth === "medium" ||
            s.lineWidth === "wide"
          ) {
            html.setAttribute("data-line-width", s.lineWidth);
          }
        } catch (e) {
          // Storage blocked or unreadable: the app applies the defaults when it starts
        }
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>

    <!-- GoatCounter analytics - privacy-friendly, no cookies, GDPR compliant -->
    <!-- Dashboard: https://namsbokasafn.goatcounter.com -->
    <!-- Injected after the load event: even an async script delays window
         'load' while its request is pending, so a slow or hung analytics CDN
         would block page readiness (it stalled CI's e2e run on 2026-06-09) -->
    <script>
      window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://gc.zgo.at/count.js";
        s.dataset.goatcounter = "https://namsbokasafn.goatcounter.com/count";
        document.body.appendChild(s);
      });
    </script>
  </body>
</html>
